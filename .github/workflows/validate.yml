name: Validate synthetic portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m src.validate_data --data data
      - run: python -m src.main
      - name: Broken fixture must fail
        shell: bash
        run: |
          set +e
          python -m src.validate_data --data tests/fixtures/broken --output outputs/validation_broken.json
          result=$?
          test "$result" -eq 1
